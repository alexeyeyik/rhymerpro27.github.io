<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рифмогенератор Pro</title>
    <style>
        :root {
            --bg-main: #1e1e1e;
            --bg-card: #252525;
            --text-main: #e0e0e0;
            --accent: #2ecc71;
            --border: #333;
        }
        [data-theme="light"] {
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #333;
            --border: #ddd;
        }
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; background: var(--bg-main); color: var(--text-main); transition: 0.3s; }
        .control-panel { width: 60px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; }
        .btn-icon { background: none; border: 1px solid var(--border); color: var(--text-main); cursor: pointer; padding: 10px; border-radius: 8px; }
        #info { display: none; width: 250px; padding: 20px; background: var(--bg-card); border-right: 1px solid var(--border); font-size: 14px; }
        #info.active { display: block; }
        .notepad { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        textarea { flex: 1; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); border-radius: 12px; padding: 15px; font-size: 18px; resize: none; outline: none; }
        .sidebar { width: 300px; padding: 20px; background: var(--bg-card); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        input { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); margin-bottom: 10px; }
        .search-btn { padding: 10px; background: var(--accent); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #results { flex: 1; overflow-y: auto; margin-top: 15px; font-size: 16px; }
        .word-item { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .score { color: var(--accent); font-size: 12px; }
        
        @media (max-width: 800px) {
            body { flex-direction: column; height: auto; }
            .control-panel { width: 100%; flex-direction: row; height: 60px; padding: 0; justify-content: center; }
            .sidebar, #info { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body data-theme="dark">

<div class="control-panel">
    <button class="btn-icon" onclick="toggleTheme()">🌓</button>
    <button class="btn-icon" onclick="toggleInfo()">❓</button>
</div>

<div id="info">
    <h3>Как пользоваться</h3>
    <p>Пиши слово с <b>ЗАГЛАВНОЙ</b> гласной там, где ударение.</p>
    <p>Пример: <i>стенА</i> или <i>мОре</i>.</p>
</div>

<div class="notepad">
    <h2>Блокнот для стихов</h2>
    <textarea placeholder="Начни писать свою поэму здесь..."></textarea>
</div>

<div class="sidebar">
    <h3>Поиск рифм</h3>
    <div id="status" style="font-size: 12px; color: gray; margin-bottom: 5px;">Загрузка словаря...</div>
    <input type="text" id="wordInput" placeholder="водА" onkeypress="if(event.key==='Enter') find()">
    <button class="search-btn" onclick="find()">Найти</button>
    <div id="results"></div>
</div>

<script>
    let dictionary = [];
    const VOWELS = "аеёиоуыэюяАЕЁИОУЫЭЮЯ";

    async function load() {
        const status = document.getElementById('status');
        try {
            // Исправленный путь для GitHub Pages
            const res = await fetch('./dictionary.txt');
            if (!res.ok) throw new Error('Файл не найден');
            const text = await res.text();
            dictionary = text.split('\n').map(line => {
                let w = line.trim();
                let p = w.indexOf('+');
                if (p !== -1) {
                    let clean = w.replace('+', '');
                    let pos = p - 1;
                    if (!VOWELS.includes(clean[pos])) pos = p;
                    return clean.slice(0, pos) + clean[pos].toUpperCase() + clean.slice(pos + 1);
                }
                return w;
            }).filter(w => w.length > 1);
            status.innerText = "✅ Готово: " + dictionary.length + " слов";
        } catch (e) {
            status.innerText = "❌ Ошибка: проверь dictionary.txt";
            console.error(e);
        }
    }

    function find() {
        const input = document.getElementById('wordInput').value.trim();
        const resDiv = document.getElementById('results');
        if (!input) return;

        let stressIdx = -1;
        for(let i=0; i<input.length; i++) {
            if (input[i] === input[i].toUpperCase() && input[i] !== input[i].toLowerCase()) {
                stressIdx = i; break;
            }
        }

        if (stressIdx === -1) {
            resDiv.innerHTML = "<span style='color:orange'>Нужна БОЛЬШАЯ гласная!</span>";
            return;
        }

        const tail = input.substring(stressIdx).toLowerCase();
        const matches = dictionary.map(w => {
            let wStressIdx = -1;
            for(let i=0; i<w.length; i++) {
                if (w[i] === w[i].toUpperCase() && w[i] !== w[i].toLowerCase()) {
                    wStressIdx = i; break;
                }
            }
            if (wStressIdx === -1) return null;
            if (w.substring(wStressIdx).toLowerCase() !== tail) return null;

            // Вес рифмы
            let score = 0;
            const s1 = input.toLowerCase();
            const s2 = w.toLowerCase();
            for(let i=1; i <= Math.min(s1.length, s2.length); i++) {
                if (s1[s1.length-i] === s2[s2.length-i]) score++;
                else break;
            }
            return { w, score };
        }).filter(x => x).sort((a,b) => b.score - a.score);

        resDiv.innerHTML = matches.length ? 
            matches.slice(0, 50).map(m => `<div class="word-item"><span>${m.w.toLowerCase()}</span><span class="score">вес:${m.score}</span></div>`).join('') 
            : "Рифм не найдено.";
    }

    function toggleTheme() {
        const b = document.body;
        b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
    function toggleInfo() { document.getElementById('info').classList.toggle('active'); }

    load();
</script>
</body>
</html>
